version: 2

models:
  - name: stg_sales_lines
    description: Clean, typed invoice lines for registered and guest customers, with a channel flag.
    columns:
      - name: invoice_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: invoiced_at
        data_tests: [not_null]
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: [Registered, Guest]
      - name: unit_price
        data_tests: [positive]

  - name: stg_transactions
    description: Registered-customer invoice lines with revenue and a cancellation flag.
    columns:
      - name: invoice_id
        data_tests: [not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: invoiced_at
        data_tests: [not_null]
