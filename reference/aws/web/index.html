<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Repurchase Predictor</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1f2937; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.sub { color: #6b7280; margin-top: 0; }
  label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; gap: 12px; }
  input { width: 160px; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; }
  button { margin-top: 16px; width: 100%; padding: 10px; background: #232f3e; color: #fff; border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  #result { margin-top: 20px; padding: 16px; border-radius: 8px; background: #f3f4f6; display: none; }
  .big { font-size: 2rem; font-weight: 700; }
</style>
</head>
<body>
  <h1>Customer Repurchase Predictor</h1>
  <p class="sub">SageMaker XGBoost model served through API Gateway and Lambda.</p>

  <label>API URL <input id="url" placeholder="https://...amazonaws.com/prod/predict"></label>
  <label>Days since last purchase <input id="recency_days" type="number" value="20"></label>
  <label>Number of orders <input id="frequency" type="number" value="8"></label>
  <label>Total spent (GBP) <input id="monetary" type="number" value="1450"></label>
  <label>Average order value <input id="avg_order_value" type="number" value="181"></label>
  <label>Unique products bought <input id="unique_products" type="number" value="64"></label>
  <label>Days as customer <input id="tenure_days" type="number" value="410"></label>
  <label>Return rate (0 to 1) <input id="return_rate" type="number" step="0.01" value="0.05"></label>
  <label>Orders in last 90 days <input id="orders_last_90d" type="number" value="2"></label>
  <label>Average days between orders <input id="avg_days_between_orders" type="number" value="55"></label>
  <label>UK customer (1 or 0) <input id="is_uk" type="number" value="1"></label>

  <button onclick="predict()">Predict</button>
  <div id="result"></div>

<script>
const FIELDS = ["recency_days","frequency","monetary","avg_order_value","unique_products",
                "tenure_days","return_rate","orders_last_90d","avg_days_between_orders","is_uk"];
async function predict() {
  const out = document.getElementById("result");
  out.style.display = "block";
  out.textContent = "Calling the model...";
  const body = {};
  FIELDS.forEach(f => body[f] = parseFloat(document.getElementById(f).value));
  try {
    const r = await fetch(document.getElementById("url").value, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    out.innerHTML = `<div class="big">${(d.repurchase_probability * 100).toFixed(1)}%</div>
      <div>${d.prediction}</div><div><b>Action:</b> ${d.recommended_action}</div>`;
  } catch (e) { out.textContent = "Error: " + e.message; }
}
</script>
</body>
</html>
